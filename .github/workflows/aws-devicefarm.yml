name: AWS Device Farm 真机回归

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aws-devicefarm.yml"
      - "VideoToolboxStudio/**"
      - "VideoToolboxStudioCloudTests/**"
      - "project.yml"
      - "scripts/run-aws-devicefarm-xcuitest.sh"
      - "scripts/install-xcodegen.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/aws-devicefarm.yml"
      - "VideoToolboxStudio/**"
      - "VideoToolboxStudioCloudTests/**"
      - "project.yml"
      - "scripts/run-aws-devicefarm-xcuitest.sh"
      - "scripts/install-xcodegen.sh"

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: aws-devicefarm-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODEGEN_VERSION: "2.46.0"
  AWS_REGION: us-west-2
  AWS_DEVICE_FARM_PROJECT_ARN: arn:aws:devicefarm:us-west-2:247332612374:project:36ab8700-d09f-42fa-ad15-65df8d06958b
  AWS_DEVICE_FARM_ROLE_ARN: arn:aws:iam::247332612374:role/bxwllzz@github
  AWS_DEVICE_FARM_MIN_IOS_MAJOR: "26"
  AWS_DEVICE_FARM_TEST_FILTER: ${{ github.event_name == 'pull_request' && 'CapabilityProbeCloudUITests/testCloudTranscodePreservesMediaContract' || '' }}

jobs:
  cloud-device-test:
    name: 构建并执行 iOS 真机编码回归
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.id == github.event.repository.id &&
        github.event.pull_request.user.id == 4355526
      )
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装固定版本 XcodeGen
        run: scripts/install-xcodegen.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 构建 App 与 XCUITest Runner
        run: |
          set -euo pipefail
          mkdir -p build/aws-devicefarm/logs
          xcodebuild \
            -project VideoToolboxStudio.xcodeproj \
            -scheme VideoToolboxStudioCloud \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${PWD}/build/AWSDeviceFarmDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            BUILD_COMMIT_SHA="${GITHUB_SHA}" \
            BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            BUILD_RUN_ID="${GITHUB_RUN_ID}" \
            BUILD_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build-for-testing \
            2>&1 | tee build/aws-devicefarm/logs/xcodebuild.log

      - name: 打包 Device Farm 上传对象
        run: |
          set -euo pipefail
          readonly products="${PWD}/build/AWSDeviceFarmDerivedData/Build/Products/Debug-iphoneos"
          readonly app_path="${products}/VideoToolboxStudio.app"
          runner_path="$(find "${products}" -maxdepth 1 -type d -name 'VideoToolboxStudioCloudTests-Runner.app' -print -quit)"
          readonly runner_path

          if [[ ! -d "${app_path}" || -z "${runner_path}" ]]; then
            echo "错误：未找到 App 或 XCUITest Runner。" >&2
            find "${products}" -maxdepth 2 -print >&2
            exit 1
          fi

          mkdir -p build/aws-devicefarm/package/Payload
          ditto "${app_path}" build/aws-devicefarm/package/Payload/VideoToolboxStudio.app
          (
            cd build/aws-devicefarm/package
            /usr/bin/zip -q -r VideoToolboxStudio.ipa Payload
          )
          (
            cd "${products}"
            /usr/bin/zip \
              --symlinks \
              -q \
              -r \
              "${GITHUB_WORKSPACE}/build/aws-devicefarm/package/VideoToolboxStudioCloudTests.zip" \
              "$(basename "${runner_path}")"
          )

      - name: 上传待验证测试包
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aws-devicefarm-package-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/aws-devicefarm/package
            build/aws-devicefarm/logs/xcodebuild.log
          if-no-files-found: error
          retention-days: 14

      - name: 记录 OIDC 信任声明
        run: |
          set -euo pipefail
          response="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"
          oidc_token="$(jq -r '.value' <<<"${response}")"
          export OIDC_TOKEN_FOR_CLAIMS="${oidc_token}"
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          token = os.environ["OIDC_TOKEN_FOR_CLAIMS"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          allowed = {
              key: claims.get(key)
              for key in (
                  "aud",
                  "sub",
                  "actor",
                  "actor_id",
                  "repository",
                  "repository_id",
                  "repository_owner",
                  "repository_owner_id",
                  "ref",
                  "sha",
                  "workflow",
                  "workflow_ref",
                  "job_workflow_ref",
                  "job",
                  "environment",
              )
          }
          output = Path("build/aws-devicefarm/logs/oidc-claims.json")
          output.write_text(
              json.dumps(allowed, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          PY
          unset OIDC_TOKEN_FOR_CLAIMS oidc_token response
          jq '{aud, sub, actor, actor_id, repository, repository_id, repository_owner, repository_owner_id, ref, workflow, workflow_ref, job_workflow_ref, job, environment}' \
            build/aws-devicefarm/logs/oidc-claims.json

      - name: 通过 OIDC 获取 AWS 临时凭据
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEVICE_FARM_ROLE_ARN }}
          role-session-name: VideoToolboxStudio-${{ github.run_id }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: 验证 AWS 身份与项目权限
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          aws devicefarm get-project \
            --arn "${AWS_DEVICE_FARM_PROJECT_ARN}" \
            --region "${AWS_REGION}" \
            > build/aws-devicefarm/logs/project.json
          echo "OIDC 临时身份与 Device Farm 项目读取权限均已验证。"

      - name: 运行 AWS Device Farm 真机测试
        run: |
          bash scripts/run-aws-devicefarm-xcuitest.sh \
            build/aws-devicefarm/package/VideoToolboxStudio.ipa \
            build/aws-devicefarm/package/VideoToolboxStudioCloudTests.zip \
            build/aws-devicefarm/results

      - name: 上传 AWS 真机证据
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aws-devicefarm-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/aws-devicefarm/logs
            build/aws-devicefarm/results
          if-no-files-found: warn
          retention-days: 14


      - name: 发布 AWS 真机提交状态
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success)
              state="success"
              description="AWS Device Farm 真机回归通过"
              ;;
            failure)
              state="failure"
              description="AWS Device Farm 真机回归失败"
              ;;
            *)
              state="error"
              description="AWS Device Farm 真机回归未正常完成"
              ;;
          esac

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="AWS Device Farm 真机回归" \
            -f description="${description}" \
            -f target_url="${RUN_URL}"
