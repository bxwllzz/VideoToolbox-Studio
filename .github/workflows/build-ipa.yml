name: 构建无签名 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODEGEN_VERSION: "2.46.0"

jobs:
  package:
    name: 编译并打包
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装固定版本 XcodeGen
        run: scripts/install-xcodegen.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 计算构建身份
        id: identity
        run: |
          set -euo pipefail
          build_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "build_timestamp=${build_timestamp}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "${GITHUB_OUTPUT}"

      - name: 编译无签名真机版本
        env:
          BUILD_TIMESTAMP: ${{ steps.identity.outputs.build_timestamp }}
        run: |
          set -euo pipefail
          mkdir -p build/logs
          xcodebuild \
            -project VideoToolboxStudio.xcodeproj \
            -scheme VideoToolboxStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CONFIGURATION_BUILD_DIR="${PWD}/build/device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            BUILD_COMMIT_SHA="${GITHUB_SHA}" \
            BUILD_TIMESTAMP="${BUILD_TIMESTAMP}" \
            BUILD_RUN_ID="${GITHUB_RUN_ID}" \
            BUILD_RUN_NUMBER="${GITHUB_RUN_NUMBER}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            clean build \
            2>&1 | tee build/logs/device-build.log

      - name: 生成构建信息与 IPA
        env:
          BUILD_COMMIT_SHA: ${{ github.sha }}
          BUILD_TIMESTAMP: ${{ steps.identity.outputs.build_timestamp }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          scripts/create-build-info.sh build/manifest/build-info.json
          scripts/package-unsigned-ipa.sh \
            build/device/VideoToolboxStudio.app \
            build/manifest/build-info.json \
            "${PWD}/build/artifact"
          cp build/logs/device-build.log build/artifact/device-build.log

      - name: 上传 SideStore 安装包
        uses: actions/upload-artifact@v7.0.1
        with:
          name: VideoToolboxStudio-${{ github.run_number }}-${{ steps.identity.outputs.short_sha }}
          path: build/artifact
          if-no-files-found: error
          retention-days: 14
